name: Demon-Implant Bug Report
description: File a bug report for the Demon Implant
title: "[Demon Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "What did you expect to happen?"
      placeholder: "Describe the bug and expected behavior."
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: branch
    attributes:
      label: Did You Try With the Dev Branch?
      description: "The dev branch has the latest fixes - it might solve your problem."
      options:
        - "Yes (tried dev branch, problem persists)"
        - "No (only tried main branch)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      description: "Copy and paste any relevant log output. Auto-formatted as code."
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: "Checklist"
      options:
        - label: "I provided replication steps and enough information to understand the issue."
          required: true
