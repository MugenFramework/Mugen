name: "Teamserver/Client Bug Report"
description: File a bug report for the Mugen teamserver or client.
title: "[Teamserver-Client Bug]: "
labels: ["clientside/teamserver"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: input
    id: contact
    attributes:
      label: "Contact Details"
      description: "How can we get in touch with you if we need more info?"
      placeholder: "ex. email@example.com"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "What did you expect to happen?"
      placeholder: "Describe the bug and expected behavior."
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Did You Do a Pull First?
      description: "What version of Mugen are you running?"
      options:
        - "Latest (pulled first)"
        - "Anything else (didn't pull)"
    validations:
      required: true
  - type: dropdown
    id: branch
    attributes:
      label: Did You Try With the Dev Branch?
      description: "The dev branch has the latest fixes - it might solve your problem."
      options:
        - "Yes (tried dev branch, problem persists)"
        - "No (only tried main branch)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      description: "Copy and paste any relevant log output. Auto-formatted as code."
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: "Checklist"
      options:
        - label: "I provided replication steps and enough information to understand the issue."
          required: true
