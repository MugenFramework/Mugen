name: Documentation Bug Report
description: File a bug report for the Mugen documentation.
title: "[Docs Bug]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: input
    id: contact
    attributes:
      label: "Contact Details"
      description: "How can we get in touch with you if we need more info?"
      placeholder: "ex. email@example.com"
    validations:
      required: false
  - type: textarea
    id: what-grammar
    attributes:
      label: "What's the issue?"
      description: "What should it say instead?"
      placeholder: "Describe the documentation error."
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Did You Do a Pull First?
      description: "Make sure you are looking at the latest version of the docs."
      options:
        - "Latest (pulled first)"
        - "Anything else (didn't pull)"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: "Checklist"
      options:
        - label: "I provided enough information for identification and remediation of the issue."
          required: true
